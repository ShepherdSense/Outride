# Outride CI — builds the Android APK and Windows app on every push
# that touches app code, so nobody has to build them by hand.
# Public repo: GitHub Actions runners are free here.
# Push a version tag (v0.29.5, ...) and the built apps are attached
# to a GitHub Release automatically — that's the public download page.
# First cut builds a debug APK (installs fine on your own devices);
# release signing via a stored keystore can be added later.
name: Build apps

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apps.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outride-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath outride-windows.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outride-windows
          path: outride-windows.zip

  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: outride-android-debug
          path: release/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: outride-windows
          path: release/
      - run: mv release/app-debug.apk release/outride-android.apk
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: Outride ${{ github.ref_name }}
          body: |
            Android APK (debug build) and Windows app, built automatically.
            No building needed — download and run.
          files: |
            release/outride-android.apk
            release/outride-windows.zip
