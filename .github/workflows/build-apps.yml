# Outride CI — builds the Android APK and Windows app on every push
# that touches app code, so nobody has to build them by hand.
# Public repo: GitHub Actions runners are free here.
# First cut builds a debug APK (installs fine on your own devices);
# release signing via a stored keystore can be added later.
name: Build apps

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: outride-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath outride-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: outride-windows
          path: outride-windows.zip
