name: outride
description: Outride — device-free RF sensing tripwire for Silvus StreamCaster mesh radios.
publish_to: "none"
version: 0.30.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.1
  http: ^1.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.3.2
  universal_ble: ^2.3.0
  # 802.11mc/802.11az WiFi RTT ranging (Android only; guarded at runtime).
  wifi_ftm: ^0.2.0

  # ZMeta invite-code pairing ("Join network"): X25519 keygen, TLS
  # fingerprint pinning, QR of the WireGuard config.
  cryptography: ^2.7.0
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  # ZMeta HTTPS ingest bearer token (secure storage, never prefs).
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  sensors_plus: ^7.1.1
  flutter_tts: ^4.2.3
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  # Freezed-generated lib code imports freezed_annotation at runtime,
  # so it lives in dependencies (not dev_dependencies).
  freezed_annotation: ^3.1.0
  # Per-link dip time series on the Radios & Links screen (v0.30.0).
  # Pure Dart — supports Android + Windows.
  fl_chart: ^1.3.1
  # Background tripwire alerts (v0.30.0): local notification beside
  # the voice alert. Android only in this build (see
  # lib/services/tripwire_notifications.dart); POST_NOTIFICATIONS is
  # already declared in android/app/src/main/AndroidManifest.xml.
  flutter_local_notifications: ^23.0.4
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Direct import in test/voice_alert_service_test.dart (the 20 s
  # speak-timeout test drives fake time); pinned to the version
  # flutter_test already resolves transitively.
  fake_async: ^1.3.3
  freezed: ^4.0.3
  build_runner: ^2.17.1
  patrol: ^4.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/disturbance_clf.json
    - assets/models/track_stitcher.json
    # Header brand mark (amber Aussie head, derived from the 1024 px
    # launcher source); the launcher source itself is not bundled.
    - assets/icon/outride_mark_header.png
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
